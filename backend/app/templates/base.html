<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Patient Dashboard{% endblock %}</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --muted:#94a3b8; --text:#e2e8f0; --accent:#38bdf8; --border:#334155; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    header.site { display:flex; align-items:baseline; gap:12px; margin-bottom:20px; }
    header.site h1 { font-size: 20px; margin:0; }
    header.site .muted { color: var(--muted); font-size: 13px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:18px; }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:14px; }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    tr:last-child td { border-bottom:none; }
    form.filters { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:16px; }
    form.filters label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:4px; }
    input { background:#0b1220; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px; }
    button { background:var(--accent); color:#04263a; border:none; border-radius:8px; padding:9px 14px; font-weight:600; cursor:pointer; }
    .btn-secondary { background:transparent; border:1px solid var(--border); color:var(--text); padding:9px 14px; border-radius:8px; }
    .muted { color: var(--muted); }
    .pill { display:inline-block; background:#0b1220; border:1px solid var(--border); border-radius:999px; padding:2px 10px; font-size:12px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:10px 24px; }
    .grid div span { display:block; color:var(--muted); font-size:12px; }
    pre.transcript { white-space:pre-wrap; background:#0b1220; border:1px solid var(--border); border-radius:8px; padding:12px; font-size:13px; max-height:340px; overflow:auto; }
    .empty { color:var(--muted); font-style:italic; padding:8px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <h1><a href="/dashboard">Patient Registration</a></h1>
      <span class="muted">CareCloud voice intake &middot; internal dashboard</span>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
