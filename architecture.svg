<svg width="1180" height="840" viewBox="0 0 1180 840" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Patient registration voice agent architecture</title>
<desc>A caller talks to a Retell voice agent, which calls FastAPI tool and webhook endpoints on Railway; FastAPI writes to PostgreSQL through a shared service layer that also backs the REST API and the Lovable staff dashboard.</desc>

<rect x="0" y="0" width="1180" height="840" fill="#FFFFFF"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Caller -->
<rect x="470" y="30" width="220" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="580" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Caller</text>
<text x="580" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">+1 (413) 848-7102</text>

<!-- Lovable dashboard -->
<rect x="900" y="30" width="250" height="64" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.75"/>
<text x="1025" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#4B1528">Lovable dashboard</text>
<text x="1025" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#72243E">Staff UI (external)</text>

<!-- Arrow: Caller -> Voice agent -->
<line x1="580" y1="94" x2="550" y2="205" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Arrow: Lovable -> REST box -->
<path d="M1025,94 L1025,370 L1000,370 L1000,400" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Retell container -->
<rect x="250" y="140" width="600" height="150" rx="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="270" y="170" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Retell</text>
<text x="270" y="188" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3C3489">Voice platform &#8212; owns the call</text>

<rect x="400" y="205" width="300" height="65" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.75"/>
<text x="550" y="227" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">Voice agent</text>
<text x="550" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3C3489">STT + LLM + TTS &#183; voice: 11labs-Brian</text>
<text x="550" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3C3489">English default, switches to Spanish</text>

<!-- Arrows: Retell -> Tools / Webhook -->
<path d="M470,270 L470,330 L270,330 L270,400" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M630,270 L630,330 L580,330 L580,400" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<!-- FastAPI container -->
<rect x="100" y="330" width="980" height="280" rx="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="120" y="360" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">FastAPI</text>
<text x="120" y="378" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F6E56">Railway &#183; Dockerfile + uvicorn &#183; alembic upgrade head pre-deploy &#183; healthcheck /health</text>

<!-- Row 1: entry points -->
<rect x="140" y="400" width="260" height="70" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.75"/>
<text x="270" y="426" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#085041">/retell/tools/*</text>
<text x="270" y="446" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0F6E56">Patient + appointment functions</text>

<rect x="430" y="400" width="300" height="70" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.75"/>
<text x="580" y="426" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#085041">/retell/webhook</text>
<text x="580" y="446" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0F6E56">call_started &#183; call_ended &#183; call_analyzed</text>

<rect x="760" y="400" width="280" height="70" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.75"/>
<text x="900" y="426" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#085041">/patients /appointments /calls</text>
<text x="900" y="446" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0F6E56">REST CRUD &#183; envelope: data / error</text>

<!-- Arrows: entry points -> service layer -->
<line x1="270" y1="470" x2="270" y2="500" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580" y1="470" x2="580" y2="500" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="900" y1="470" x2="900" y2="500" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Row 2: service layer -->
<rect x="140" y="500" width="900" height="60" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.75"/>
<text x="590" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#042C53">Service layer</text>
<text x="590" y="543" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0C447C">patients &#183; appointments &#183; calls services + Pydantic validation</text>

<!-- Arrow: service layer -> Postgres -->
<line x1="590" y1="560" x2="590" y2="650" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- PostgreSQL container -->
<rect x="340" y="650" width="500" height="150" rx="18" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
<text x="360" y="680" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#173404">PostgreSQL</text>
<text x="360" y="698" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3B6D11">SQLAlchemy async (asyncpg) &#183; Alembic migrations</text>

<rect x="360" y="715" width="140" height="55" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.75"/>
<text x="430" y="747" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#173404">patients</text>

<rect x="520" y="715" width="140" height="55" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.75"/>
<text x="590" y="747" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#173404">appointments</text>

<rect x="680" y="715" width="140" height="55" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.75"/>
<text x="750" y="747" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#173404">calls</text>

<!-- Legend -->
<line x1="120" y1="822" x2="150" y2="822" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="158" y="826" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5F5E5A">During call (tool calls, REST, dashboard)</text>
<line x1="470" y1="822" x2="500" y2="822" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="508" y="826" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5F5E5A">After call ends (signed webhook)</text>

</svg>
