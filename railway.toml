[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs in a one-off container before the new deployment is promoted.
preDeployCommand = "alembic upgrade head"
startCommand = "sh -c 'uvicorn backend.app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 30
